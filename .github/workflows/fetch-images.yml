# One-shot helper: downloads the AI-generated site imagery from the Higgsfield
# CDN, optimizes it with ImageMagick, and commits it to this branch.
# (The Claude Code build sandbox cannot reach the image CDN directly, so this
# runs on a GitHub runner instead.) Safe to delete once assets/img is populated.
name: Fetch site images

on:
  workflow_dispatch:
  push:
    branches: [claude/arianas-little-star-site-fxx0vt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download, optimize, and commit images
        run: |
          set -euo pipefail
          if [ -f assets/img/hero-playroom.jpg ]; then
            echo "Images already present — nothing to do."
            exit 0
          fi

          mkdir -p assets/img /tmp/raw
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3Eo0plEBHjUHQRD43deljO310QH"

          declare -A images=(
            [hero-playroom]="hf_20260707_140558_5071a043-0065-41e6-ab17-59ca933d267f.png"
            [gallery-backyard]="hf_20260707_140600_f183efd3-3db0-4989-8cf3-ea8ac2edfecd.png"
            [gallery-art]="hf_20260707_140607_95c28103-164d-4897-8b76-c4341fd797cc.png"
            [gallery-mealtime]="hf_20260707_140611_826898a0-490c-4798-98dc-a26fb3e99c21.png"
            [gallery-story]="hf_20260707_140617_eb1ee8d7-1eca-477e-be2c-5c770cfec0c3.png"
            [gallery-nap]="hf_20260707_140619_7d66aa28-2314-4e54-bdbd-85c14f4427e6.png"
            [gallery-water]="hf_20260707_140630_6804479c-9c58-4504-86ee-21bef00428de.png"
            [gallery-reading]="hf_20260707_140637_c23be986-c0f6-4fe6-a562-7bbda600660a.png"
            [ariana-portrait]="hf_20260707_140640_6c6add80-0101-419d-84b8-17f7f7a07e94.png"
            [gallery-mixed-age]="hf_20260707_160224_eaade784-385e-497b-93d5-928de0b68d5f.png"
          )

          for name in "${!images[@]}"; do
            curl -fsSL -o "/tmp/raw/$name.png" "$base/${images[$name]}"
          done

          # hero: wide, higher res; portrait: tall; gallery: 1200px wide
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          jobs = [("hero-playroom", 1920, 82), ("ariana-portrait", 1000, 82)] + [
              (f"gallery-{g}", 1200, 80)
              for g in ["backyard", "art", "mealtime", "story", "nap", "water", "reading", "mixed-age"]
          ]
          for name, width, quality in jobs:
              im = Image.open(f"/tmp/raw/{name}.png").convert("RGB")
              if im.width > width:
                  im = im.resize((width, round(im.height * width / im.width)), Image.LANCZOS)
              im.save(f"assets/img/{name}.jpg", "JPEG", quality=quality, optimize=True, progressive=True)
              print(name, im.size)
          PY
          ls -la assets/img

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git commit -m "Add optimized AI-generated site imagery"
          git push
